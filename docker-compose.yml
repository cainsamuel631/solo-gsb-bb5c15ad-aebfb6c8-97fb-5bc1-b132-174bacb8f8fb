services:
  subtitle-checker:
    build: .
    image: subtitle-checker:latest
    container_name: subtitle-checker
    ports:
      - "8000:8000"
    volumes:
      - subtitle-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  subtitle-data:
